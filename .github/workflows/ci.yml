name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint / Typecheck / Tests (optional)
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present -- --ci
      - name: Build
        run: npm run build
